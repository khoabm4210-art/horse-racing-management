# Server Configuration
server.port=8080
server.servlet.context-path=/api
spring.application.name=horse-racing-api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/horse_racing?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT Configuration
jwt.secret=horse_racing_secret_key_change_in_production_environment_very_important_12345
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.horseracing=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true